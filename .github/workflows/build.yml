name: Build

on:
  push:
    branches:
      - main
  # Validate both direct PRs and contributor PRs redirected by repository policy.
  pull_request:
    branches:
      - main
      - contributor
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      # Hosted runners are ephemeral. Reuse one private debug key so each Dev
      # APK can upgrade the preceding one without clearing the user's data.
      - name: Configure development signing
        if: github.event_name != 'pull_request' && github.repository == 'lladlam/MeloX-Android'
        env:
          MELOX_DEV_KEYSTORE_BASE64: ${{ secrets.MELOX_DEV_KEYSTORE_BASE64 }}
        run: |
          test -n "$MELOX_DEV_KEYSTORE_BASE64" || { echo "Missing development signing key" >&2; exit 1; }
          mkdir -p "$HOME/.android"
          umask 077
          printf '%s' "$MELOX_DEV_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --max-workers=2 --stacktrace

      # A release asset downloads without a GitHub login, unlike an Actions artifact.
      # The fixed tag and fixed file name mean every build replaces the same file, so
      # nothing accumulates and no retention policy is needed.
      - name: Publish rolling development release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk /tmp/MeloX-Android-debug.apk
          cp android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk /tmp/MeloX-Android-debug-arm64-v8a.apk
          cp android/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk /tmp/MeloX-Android-debug-armeabi-v7a.apk
          gh release view dev-latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 \
            || gh release create dev-latest --repo "${GITHUB_REPOSITORY}" \
                 --prerelease --title "Development build" \
                 --notes "Rolling debug build, overwritten on every push to main. MeloX-Android-debug.apk is arm64-v8a; the armeabi-v7a file is provided separately."
          gh release upload dev-latest \
            /tmp/MeloX-Android-debug.apk \
            /tmp/MeloX-Android-debug-arm64-v8a.apk \
            /tmp/MeloX-Android-debug-armeabi-v7a.apk \
            --clobber --repo "${GITHUB_REPOSITORY}"

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: MeloX-Android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
